version: 0.2

phases:
  install:
    runtime-versions:
      golang: 1.27
    commands:
      - mkdir -p /tmp/go-cache
      - go version

  pre_build:
    commands:
      - export GOCACHE=/tmp/go-cache
      - go mod download

  build:
    commands:
      - export GOCACHE=/tmp/go-cache
      - echo "Running unit tests..."
      - go test ./...
      - echo "Building Elastic Beanstalk bundle..."
      - mkdir -p bundle/bin
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bundle/bin/gateway ./cmd/gateway
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bundle/bin/order-service ./cmd/order-service
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bundle/bin/product-service ./cmd/product-service
      - cp deploy/beanstalk/Procfile bundle/Procfile
      - if [ -d deploy/beanstalk/.ebextensions ]; then cp -r deploy/beanstalk/.ebextensions bundle/.ebextensions; fi
      - test -x bundle/bin/gateway
      - test -x bundle/bin/order-service
      - test -x bundle/bin/product-service
      - test -f bundle/Procfile

artifacts:
  base-directory: bundle
  files:
    - '**/*'
  discard-paths: no
