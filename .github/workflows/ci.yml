name: Go CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Dependency vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: High-severity code scan
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          gosec -severity high ./...

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
      - name: Build Linux services
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/gateway ./cmd/gateway
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/order-service ./cmd/order-service
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/product-service ./cmd/product-service
          tar -czf oms-release.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: oms-linux-amd64
          path: oms-release.tar.gz
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: [quality, build]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_ROLE_ARN != '' &&
      vars.AWS_REGION != '' &&
      vars.AWS_S3_BUCKET != '' &&
      vars.AWS_EC2_INSTANCE_ID != ''
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oms-linux-amd64
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload release to S3
        env:
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
        run: aws s3 cp oms-release.tar.gz "s3://${AWS_S3_BUCKET}/releases/${GITHUB_SHA}/oms-release.tar.gz"
      - name: Deploy through Systems Manager
        env:
          AWS_EC2_INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
        run: |
          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$AWS_EC2_INSTANCE_ID" \
            --parameters "commands=[\"set -eu; aws s3 cp s3://${AWS_S3_BUCKET}/releases/${GITHUB_SHA}/oms-release.tar.gz /tmp/oms-release.tar.gz; tar -xzf /tmp/oms-release.tar.gz -C /opt/oms/bin; chmod 0755 /opt/oms/bin/gateway /opt/oms/bin/order-service /opt/oms/bin/product-service; systemctl restart oms-product-service oms-order-service oms-gateway; systemctl is-active oms-product-service oms-order-service oms-gateway\"]" \
            --query 'Command.CommandId' \
            --output text)
          for attempt in $(seq 1 30); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$AWS_EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)
            case "$status" in
              Success) exit 0 ;;
              Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$AWS_EC2_INSTANCE_ID" \
                  --query StandardErrorContent \
                  --output text
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for SSM deployment command $command_id" >&2
          exit 1
